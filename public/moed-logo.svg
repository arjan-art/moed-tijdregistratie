<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c5282"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="100" cy="100" r="95" fill="url(#shieldBg)" stroke="#c9960a" stroke-width="4"/>

  <!-- Inner gold ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d4a017" stroke-width="2" opacity="0.6"/>

  <!-- Clock icon -->
  <g transform="translate(100, 78)">
    <!-- Outer clock circle -->
    <circle cx="0" cy="0" r="28" fill="#f7fafc" stroke="#d4a017" stroke-width="2.5"/>
    <!-- Inner face -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="#cbd5e0" stroke-width="0.5"/>
    <!-- Hour markers -->
    <line x1="0" y1="-20" x2="0" y2="-16" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="20" x2="0" y2="16" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <line x1="-20" y1="0" x2="-16" y2="0" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="0" x2="16" y2="0" stroke="#2d3748" stroke-width="2" stroke-linecap="round"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#e87e28" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="10" y2="-5" stroke="#e87e28" stroke-width="2" stroke-linecap="round"/>
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3.5" fill="#2c5282"/>
    <circle cx="0" cy="0" r="1.5" fill="#d4a017"/>
  </g>

  <!-- MOED text -->
  <text x="100" y="148" font-family="Arial Black, 'Arial', sans-serif" font-size="38" 
        font-weight="900" fill="#f7fafc" text-anchor="middle" letter-spacing="3">MOED</text>

  <!-- Gear icon as 'O' accent (small, subtle) -->
  <circle cx="88" cy="138" r="5" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  <circle cx="88" cy="138" r="2" fill="#d4a017"/>

  <!-- Bottom tagline -->
  <text x="100" y="166" font-family="Arial, sans-serif" font-size="10" 
        font-weight="600" fill="#c9960a" text-anchor="middle" letter-spacing="1">TIJDREGISTRATIE</text>
</svg>